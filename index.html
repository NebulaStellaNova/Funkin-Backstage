<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funkin' Backstage</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>
  <img src="right light.png" alt="Description" style="position: fixed; top: 0px; right: 0px; z-index: 1000; width: 25vw">
  <img src="left light.png" alt="Description" style="position: fixed; top: 0px; left: 0px; z-index: 1000; width: 25vw">
  <div class="container">
    <h1 style="font-family: 'FunkinLingLong', sans-serif;">Funkin' Backstage</h1>
    <p style="font-family: 'FunkinOptions', sans-serif;">For Modders. By Modders. <i><u>NO</u></i> Automation.</p>
    <div style="display: block; margin: 1rem auto 0;">
      <a href="mods">
        <img src="discover mods.png" class="smooth-btn" alt="Discover Mods" style="height: 4rem; margin-right: 10px; cursor: pointer;">
      </a>      <a href="signup"><img src="sign-up.png" class="smooth-btn" alt="Sign Up" style="height: 4rem; margin-left: 10px; cursor: pointer;"></a>
    </div>
  </div>
  <p style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666;">© 2026 NebulaStellaNova — Fan-made, not affiliated with Newgrounds or The Funkin' Crew, Inc.</p>

  <div class="irisEffect" style="z-index: 5000;"></div>
  <script src="script.js"></script>
  <script src="api.js"></script>
  <script>
    (async function() {
      const token = localStorage.getItem('token');
      if (!token) return;
      const res = await fetch(`${API}/api/me`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({})
      });
      if (res.ok) {
        const signUpBtn = document.querySelector('img[src="sign-up.png"]');
        if (signUpBtn) signUpBtn.closest('a').remove();
      }
    })();
  </script>
</body>
</html>
