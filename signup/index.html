<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Funkin' Backstage | Sign Up</title>
		<link rel="icon" type="image/png" href="../favicon.png">
		<link rel="stylesheet" href="../style.css">
		<link rel="stylesheet" href="../mods/style.css">
		<style>
			html, body {
				height: 100%;
				margin: 0;
			}

			body {
				display: flex;
				flex-direction: column;
				overflow-y: auto;
				font-family: 'FunkinLingLong', sans-serif;
			}

			.center-wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1rem;
				width: 100%;
				padding: 3rem 1.5rem;
				box-sizing: border-box;
				margin: auto;
			}

			.page-title {
				font-size: 5vh;
				text-align: center;
				margin: 0;
				font-weight: normal;
			}

			.page-subtitle {
				font-size: 3vh;
				margin: -0.5rem 0 0;
				color: #C7C7C7;
				text-align: center;
				font-weight: normal;
			}

			.login-link {
				color: #C7C7C7;
				text-decoration: none;
				font-size: 2vh;
				margin-top: -0.5rem;
			}

			.login-link:hover {
				color: #E1E1E1;
				text-decoration: underline;
			}

			.field {
				display: flex;
				flex-direction: row;
				align-items: center;
				height: 7vh;
				width: clamp(280px, 30vw, 500px);
				padding: 0 1.5rem 0 3rem;
				gap: 0.75rem;
				box-sizing: border-box;
			}

			.field input {
				background: transparent;
				border: none;
				outline: none;
				font-family: 'FunkinOptions', sans-serif;
				font-size: 3vh;
				color: #E1E1E1;
				width: 100%;
				caret-color: #E1E1E1;
				margin-top: 0.2rem;
			}

			.show-row {
				display: flex;
				flex-direction: row;
				align-items: center;
				gap: 0.75rem;
			}

			.show-row h1 {
				font-size: 3vh;
				line-height: 1;
				margin: 0.6rem 0 0;
				font-weight: normal;
			}

			.submit-btn {
				display: flex;
				flex-direction: row;
				align-items: center;
				height: 5vh;
				padding: 0 3rem;
				cursor: pointer;
				transition: transform 0.3s ease-out;
				user-select: none;
			}

			#sign-up {
				width: fit-content !important;
			}

			.submit-btn h1 {
				font-size: 3vh;
				margin: 0.7rem 0 0;
				font-weight: normal;
			}

			#error-msg {
				font-family: 'FunkinOptions', sans-serif;
				font-size: 2vh;
				color: #ff6b6b;
				display: none;
				margin: 0;
			}

			@media (max-width: 768px) {
				.page-title { font-size: clamp(1.5rem, 7vw, 3rem); }
				.page-subtitle { font-size: clamp(1rem, 5vw, 2rem); }
				.field { width: 85vw; }
			}
		</style>
	</head>

	<body>
		<div class="center-wrap">
			<h1 class="page-title">Welcome to Funkin' Backstage!</h1>
			<h1 class="page-subtitle">Create an account here</h1>
			<a href="../login" class="login-link">Already have one?</a>
			<div class="mod-box field" id="username-box">
				<input type="text" placeholder="USERNAME" />
			</div>
			<div class="mod-box field" id="password-box">
				<input id="password-input" type="password" placeholder="PASSWORD" />
			</div>
			<div class="show-row">
				<img draggable="false" class="check-box" src="../mods/assets/checkbox-empty.png" style="height: 2.5vh; cursor: pointer;" onclick="toggleShowPassword(this)">
				<h1>Show Password</h1>
			</div>
			<div class="mod-box smooth-btn submit-btn" id="sign-up" onclick="signUp()">
				<h1>sign up</h1>
			</div>
			<p id="error-msg"></p>
		</div>
		<p class="footer-left" style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666;"></p>
		<p class="footer-right" style="position: fixed; bottom: 1rem; right: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; text-align: right;"></p>
		<script src="../api.js"></script>
		<script>
			function toggleShowPassword(img) {
				img.classList.toggle('selected');
				const showing = img.classList.contains('selected');
				img.src = showing ? '../mods/assets/checkbox-filled.png' : '../mods/assets/checkbox-empty.png';
				document.getElementById('password-input').type = showing ? 'text' : 'password';
			}

			async function signUp() {
				const errorMsg = document.getElementById('error-msg');
				errorMsg.style.display = 'none';
				const username = document.querySelector('#username-box input').value.trim();
				const password = document.querySelector('#password-box input').value;
				try {
					const res = await fetch(`${API}/register`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ username, password })
					});
					const data = await res.json();
					if (!res.ok) {
						errorMsg.textContent = data.message;
						errorMsg.style.display = 'block';
						return;
					}
					localStorage.setItem('token', data.token);
					window.location.href = '../';
				} catch (e) {
					errorMsg.textContent = 'Could not reach server. Try again.';
					errorMsg.style.display = 'block';
				}
			}
		</script>
	</body>
</html>
