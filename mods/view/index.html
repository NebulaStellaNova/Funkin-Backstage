<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Funkin' Backstage | Mod</title>
		<link rel="icon" type="image/png" href="../../favicon.png">
		<link rel="stylesheet" href="../../style.css" type="text/css">
		<link rel="stylesheet" href="../../global-chat/style.css" type="text/css">
		<style>
			.thumbnail-box {
				background-color: transparent;
				user-select: none;
			}
			.thumbnail-wrapper {
				position: relative;
				width: 100%;
				height: 100%;
			}
			.thumbnail-wrapper img {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: contain;
				transition: opacity 0.3s ease;
			}

			.thumbnail-box-left {
				border-top-left-radius: 10%;
				border-bottom-left-radius: 10%;
			}
			.thumbnail-box-right {
				border-top-right-radius: 10%;
				border-bottom-right-radius: 10%;
			}

			.thumbnail-box:hover {
				background-color: rgba(255, 255, 225, 0.1);
			}
			.thumbnail-box:active {
				background-color: rgba(255, 255, 225, 0.2);
			}
		</style>
		<script>
			var modId = sessionStorage.getItem('modId');
			if (modId) {
				sessionStorage.removeItem('modId');
				try {
					history.replaceState(null, '', '/mods/' + modId);
				} catch (e) {
					console.log("Setting the url to mods/theID failed, BUT don't worry that's because you are testing the site :D");
				}
			} else {
				window.location.replace('/mods/');
			}
		</script>
	</head>
	<body>
		<script src="../../api.js"></script>
		<div style="display: flex; gap: 1vw;">
			<div style="display: flex; flex-direction: column; width: 55.5vw; gap: 1vh;">
				<div class="ui-box" style="padding: 3vh; padding-left: 2vw; width: 100%"><a id="title-text" style="font-size: 7vh;">Test</a> <a id="author-text" style="margin-left: 2vh; margin-top: 1vh;font-size: 5vh; color: #C7C7C7; font-family: 'FunkinOptions', sans-serif;">Test</a></div>
				<div class="ui-box" style="padding: 0vh; padding-left: 0; width: 100%">
					<div draggable="false" class="thumbnail-box thumbnail-box-left" style="width: 12.5%; height: 100%; display:flex; justify-content: center; align-items: center;" onclick="scrollThumbnail(-1)">
						<img src="arrow.png" style="height: 20vh;"/>
					</div>
					<div class="ui-box" style="padding: 1rem; width: 75%; height: 51vh">
						<div class="thumbnail-wrapper">
							<img id="thumbnail-a" style="opacity: 1;"/>
							<img id="thumbnail-b" style="opacity: 0;"/>
						</div>
					</div>
					<div class="thumbnail-box thumbnail-box-right" style="width: 12.5%; height: 100%; display:flex; justify-content: center; align-items: center;" onclick="scrollThumbnail(1)">
						<img draggable="false" src="arrow.png" style="height: 20vh; transform: scaleX(-1);"/>
					</div>
				</div>
			</div>
			<div style="width: 17.5vw;">
				<div class="ui-box" style="width: 100%"></div>
			</div>
		</div>
		<script>
			var thumbnails = [];
			var curThumbnail = 0;
			var activeSlot = 'a';

			async function populateData() {
				const meta = await fetch(`${API}/submissions/${modId}/meta.json`).then(r => r.json());
				const user = await fetch(`${API}/users/${meta.submitter}`).then(r => r.json());
				document.getElementById('title-text').textContent = meta.title;
				document.getElementById('author-text').textContent = `• ${user.username}`;
				document.getElementById('thumbnail-a').src = meta.thumbnails[0];
				thumbnails = meta.thumbnails;
				for (const thumb of thumbnails)
					document.createElement('img').src = thumb;
			}
			populateData();

			function scrollThumbnail(amt) {
				curThumbnail += amt;
				if (curThumbnail < 0) curThumbnail = thumbnails.length - 1;
				else if (curThumbnail > thumbnails.length - 1) curThumbnail = 0;

				const incoming = activeSlot === 'a' ? 'b' : 'a';
				const outgoing = activeSlot;

				document.getElementById('thumbnail-' + incoming).src = thumbnails[curThumbnail];
				document.getElementById('thumbnail-' + incoming).style.opacity = '1';
				document.getElementById('thumbnail-' + outgoing).style.opacity = '0';
				activeSlot = incoming;
			}
		</script>
	</body>
</html>
