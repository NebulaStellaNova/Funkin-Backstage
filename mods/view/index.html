<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Funkin' Backstage | Mod</title>
		<link rel="icon" type="image/png" href="../../favicon.png">
		<link rel="stylesheet" href="../../style.css" type="text/css">
		<script>
			var modId = sessionStorage.getItem('modId');
			if (modId) {
				sessionStorage.removeItem('modId');
				history.replaceState(null, '', '/mods/' + modId);
			} else {
				// Accessed directly at /mods/view/ with no redirect — go back to list
				window.location.replace('/mods/');
			}
		</script>
	</head>
	<body>
		<script src="/api.js"></script>
	</body>
</html>
