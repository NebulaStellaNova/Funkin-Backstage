<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Funkin' Backstage</title>
		<link rel="icon" type="image/png" href="../../favicon.png">
		<link rel="stylesheet" href="../../style.css" type="text/css">
		<link rel="stylesheet" href="../../global-chat/style.css" type="text/css">
		<style>

			.download-button:hover {
				cursor: pointer;
			}

			body {
				align-items: flex-start;
				padding-top: 5vh;
				overflow-y: auto;
				min-height: 100vh;
				height: auto;
				padding-bottom: 10vh;
			}
			.thumbnail-box {
				background-color: transparent;
				user-select: none;
			}
			.thumbnail-wrapper {
				position: relative;
				width: 100%;
				height: 100%;
			}
			.thumbnail-wrapper img,
			.thumbnail-wrapper video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: contain;
				transition: opacity 0.3s ease;
			}

			.thumbnail-box-left {
				border-top-left-radius: 10%;
				border-bottom-left-radius: 10%;
			}
			.thumbnail-box-right {
				border-top-right-radius: 10%;
				border-bottom-right-radius: 10%;
			}

			.thumbnail-box:hover {
				background-color: rgba(255, 255, 225, 0.1);
			}
			.thumbnail-box:active {
				background-color: rgba(255, 255, 225, 0.2);
			}
		</style>
		<script>
			var modId = sessionStorage.getItem('modId');
			if (modId) {
				sessionStorage.removeItem('modId');
				try {
					history.replaceState(null, '', '/mods/' + modId);
				} catch (e) {
					console.log("Setting the url to mods/theID failed, BUT don't worry that's because you are testing the site :D");
				}
			} else {
				window.location.replace('/mods/');
			}
		</script>
	</head>
	<body style="background-color:black">
		<script src="../../api.js"></script>
		<div style="display: flex; gap: 1vw;">
			<div style="display: flex; flex-direction: column; width: 55.5vw; gap: 1vh;">
				<div class="ui-box" style="padding: 3vh; padding-left: 2vw; width: 100%"><a id="title-text" style="font-size: 7vh;"></a> <a id="author-text" style="margin-left: 2vh; margin-top: 1vh;font-size: 5vh; color: #C7C7C7; font-family: 'FunkinOptions', sans-serif;"></a></div>
				<div class="ui-box" style="padding: 0vh; padding-left: 0; width: 100%; height: 23.7vw">
					<div class="thumbnail-box thumbnail-box-left" style="width: 12.5%; height: 100%; display:flex; justify-content: center; align-items: center;" onclick="scrollThumbnail(-1)">
						<img draggable="false" src="https://funkinbackstage.com/mods/view/arrow.png" style="height: 10vw; margin-left: 1vw"/>
					</div>
					<div class="ui-box" style="padding: 0.5rem; width: 75%; height: 100%">
						<div class="thumbnail-wrapper">
							<div id="thumbnail-a" style="opacity: 1; position: absolute; inset: 0; transition: opacity 0.3s ease;"></div>
							<div id="thumbnail-b" style="opacity: 0; position: absolute; inset: 0; transition: opacity 0.3s ease;"></div>
							<div id="video-controls" style="display:none; position:absolute; bottom:10px; right:10px; z-index:10; gap:6px; flex-direction:row;">
								<img id="btn-play" onclick="toggleVideoPlay()" draggable="false" src="https://funkinbackstage.com/mods/view/icon-playing.png" style="width:2.5vw; height:2.5vw; cursor:pointer; user-select:none; margin-left: -5.5vw;  margin-top: -2.6vw;">
								<img id="btn-mute" onclick="toggleVideoMute()" draggable="false" src="https://funkinbackstage.com/mods/view/icon-muted.png" style="width:2.5vw; height:2.5vw; cursor:pointer; user-select:none; margin-left: -2.5vw;  margin-top: -2.6vw;">
							</div>
						</div>
					</div>
					<div class="thumbnail-box thumbnail-box-right" style="width: 12.5%; height: 100%; display:flex; justify-content: center; align-items: center;" onclick="scrollThumbnail(1)">
						<img draggable="false" src="https://funkinbackstage.com/mods/view/arrow.png" style="height: 10vw; transform: scaleX(-1); margin-right: 1vw"/>
					</div>
				</div>
				<div class="ui-box" style="padding: 3vh; padding-left: 2vw; width: 100%">
					<span id="mod-description" style="font-size: 3vh; font-family: 'FunkinOptions', sans-serif;"></span>
				</div>
				
				<div style="display: flex; gap: 0.35vw;">
					<div id="downloads-box" class="ui-box" style="padding: 2vh; width: 33.3333%; justify-content: center;">
					</div>
					<div id="like-box" class="ui-box" style="padding: 2vh; width: 33.3333%; justify-content: center; cursor: pointer;" onclick="toggleLike()">
					</div>
					<div id="category-box" class="ui-box" style="padding: 2vh; width: 33.3333%; flex-direction: column; align-items: flex-end; justify-content: center; gap: 0.5vh;">
						<a id="category-text" style="font-size: 4vh;">Category</a>
						<a id="engine-text" style="font-size: 3vh;"></a>
					</div>
				</div>
			</div>
			<div style="width: 17.5vw;">
				<div class="ui-box" style="width: 100%"></div>
			</div>
		</div>
		<script src="./main.js"></script>
	</body>
</html>
