<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Funkin' Backstage</title>
		<link rel="icon" type="image/png" href="../../favicon.png">
		<link rel="stylesheet" href="../../style.css" type="text/css">
		<link rel="stylesheet" href="../../global-chat/style.css" type="text/css">
		<style>

			.download-button:hover {
				cursor: pointer;
			}

			body {
				align-items: flex-start;
				padding-top: 5vh;
				overflow-y: auto;
				min-height: 100vh;
				height: auto;
				padding-bottom: 10vh;
			}
			.thumbnail-box {
				background-color: transparent;
				user-select: none;
			}
			.thumbnail-wrapper {
				position: relative;
				width: 100%;
				height: 100%;
			}
			.thumbnail-wrapper img,
			.thumbnail-wrapper video {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: contain;
				transition: opacity 0.3s ease;
			}

			.thumbnail-box-left {
				border-top-left-radius: 10%;
				border-bottom-left-radius: 10%;
			}
			.thumbnail-box-right {
				border-top-right-radius: 10%;
				border-bottom-right-radius: 10%;
			}

			.thumbnail-box:hover {
				background-color: rgba(255, 255, 225, 0.1);
			}
			.thumbnail-box:active {
				background-color: rgba(255, 255, 225, 0.2);
			}

			.stat-icon {
				height: 3.5vh;
				margin-right: 0.5vh;
			}
			.stat-text {
			
				margin-right: 2vh;
			}
		</style>
		<script>
			var modId = sessionStorage.getItem('modId');
			if (modId) {
				sessionStorage.removeItem('modId');
				try {
					history.replaceState(null, '', '/mods/' + modId);
				} catch (e) {
					console.log("Setting the url to mods/theID failed, BUT don't worry that's because you are testing the site :D");
				}
			} else {
				window.location.replace('/mods/');
			}
		</script>
	</head>
	<body style="background-color:black">
		<script src="../../api.js"></script>
		<div style="display: flex; gap: 1vw;">
			<div style="display: flex; flex-direction: column; width: 55.5vw; gap: 1vh;">
				<div class="ui-box" style="padding: 3vh; padding-left: 2vw; width: 100%"><a id="title-text" style="font-size: 7vh;"></a> <a id="author-text" style="margin-left: 2vh; margin-top: 1vh;font-size: 5vh; color: #C7C7C7; font-family: 'FunkinOptions', sans-serif;"></a></div>
				<div class="ui-box" style="padding: 0vh; padding-left: 0; width: 100%; height: 23.7vw">
					<div class="thumbnail-box thumbnail-box-left" style="width: 12.5%; height: 100%; display:flex; justify-content: center; align-items: center;" onclick="scrollThumbnail(-1)">
						<img draggable="false" src="https://funkinbackstage.com/mods/view/arrow.png" style="height: 10vw; margin-left: 1vw"/>
					</div>
					<div class="ui-box" style="padding: 0.5rem; width: 75%; height: 100%">
						<div class="thumbnail-wrapper">
							<div draggable="false" id="thumbnail-a" style="opacity: 1; position: absolute; inset: 0; transition: opacity 0.3s ease;"></div>
							<div draggable="false" id="thumbnail-b" style="opacity: 0; position: absolute; inset: 0; transition: opacity 0.3s ease;"></div>
							<div id="video-controls" style="display:none; position:absolute; bottom:10px; right:10px; z-index:10; gap:6px; flex-direction:row;">
								<img id="btn-play" onclick="toggleVideoPlay()" draggable="false" src="https://funkinbackstage.com/mods/view/icon-playing.png" style="width:2.5vw; height:2.5vw; cursor:pointer; user-select:none; margin-left: -5.5vw;  margin-top: -2.6vw;">
								<img id="btn-mute" onclick="toggleVideoMute()" draggable="false" src="https://funkinbackstage.com/mods/view/icon-muted.png" style="width:2.5vw; height:2.5vw; cursor:pointer; user-select:none; margin-left: -2.5vw;  margin-top: -2.6vw;">
							</div>
						</div>
					</div>
					<div class="thumbnail-box thumbnail-box-right" style="width: 12.5%; height: 100%; display:flex; justify-content: center; align-items: center;" onclick="scrollThumbnail(1)">
						<img draggable="false" src="https://funkinbackstage.com/mods/view/arrow.png" style="height: 10vw; transform: scaleX(-1); margin-right: 1vw"/>
					</div>
				</div>
				<div class="ui-box" style="padding: 3vh; padding-left: 2vw; width: 100%">
					<span id="mod-description" style="font-size: 3vh; font-family: 'FunkinOptions', sans-serif;"></span>
				</div>
				
				<div style="display: flex; gap: 0.35vw;">
					<div id="downloads-box" class="ui-box" style="padding: 2vh; width: 33.3333%; justify-content: center;">
					</div>
					<div id="like-box" class="ui-box" style="padding: 2vh; width: 33.3333%; justify-content: center; cursor: pointer;" onclick="toggleLike()">
					</div>
					<div id="category-box" class="ui-box" style="padding: 2vh; width: 33.3333%; flex-direction: column; align-items: flex-end; justify-content: center; gap: 0.5vh;">
						<a id="category-text" style="font-size: 3.8vh;">Category</a>
						<a id="engine-text" style="font-size: 2.8vh;"></a>
					</div>
				</div>
			</div>
			<div style="width: 17.5vw;">
				<div class="ui-box" style="width: 100%; font-size: 3.8vh; display: flex; flex-direction: column; padding: 2.6vh">
					<div style="display: flex;">
						<img class="stat-icon" src="https://funkinbackstage.com/mods/assets/icon-download.png"/>
						<a id="download-text" class="stat-text">?</a>
						<img id="featured-icon" class="stat-icon" src="https://funkinbackstage.com/mods/assets/icon-featured.png"/>
						<a id="featured-text">FEATURED</a>
					</div>
					<div style="display: flex;">
						<img class="stat-icon" src="https://funkinbackstage.com/mods/assets/icon-views.png"/>
						<a id="view-text" class="stat-text">?</a>
						<img id="updated-icon" class="stat-icon" src="https://funkinbackstage.com/mods/assets/icon-updated.png"/>
						<a id="updated-text" class="stat-text">?</a>
						<img id="added-icon" class="stat-icon" src="https://funkinbackstage.com/mods/assets/icon-plus.png"/>
						<a id="added-text" class="">?</a>
					</div>
				</div>
			</div>
		</div>
		<script>
			var thumbnails = [];
			var curThumbnail = 0;
			var activeSlot = 'a';

			function isVideo(url) {
				return /\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(url);
			}

			function setSlot(slotId, url) {
				const slot = document.getElementById(slotId);
				if (isVideo(url)) {
					slot.innerHTML = `<video src="${url}" loop muted playsinline style="width:100%;height:100%;object-fit:contain;"></video>`;
					const vid = slot.querySelector('video');
					vid.volume = 0.5;
					vid.play().catch(() => { });
				} else {
					slot.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:contain;">`;
				}
			}

			function fmtNum(n) {
				if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
				if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
				return String(n);
			}

			function relTime(dateStr) {
				const diff = Date.now() - new Date(dateStr).getTime();
				const s = Math.floor(diff / 1000);
				if (s < 3600) return Math.max(1, Math.floor(s / 60)) + 'm';
				if (s < 86400) return Math.floor(s / 3600) + 'h';
				if (s < 2592000) return Math.floor(s / 86400) + 'd';
				if (s < 31536000) return Math.floor(s / 2592000) + 'mo';
				return Math.floor(s / 31536000) + 'y';
			}


			function timeAgo(dateStr) {
				const s = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
				if (s < 3600)   { const m = Math.max(1, Math.floor(s / 60));    return m  + (m  === 1 ? ' minute ago' : ' minutes ago'); }
				if (s < 86400)  { const h = Math.floor(s / 3600);               return h  + (h  === 1 ? ' hour ago'   : ' hours ago');   }
				if (s < 2592000){ const d = Math.floor(s / 86400);              return d  + (d  === 1 ? ' day ago'    : ' days ago');    }
				if (s < 31536000){ const mo = Math.floor(s / 2592000);          return mo + (mo === 1 ? ' month ago'  : ' months ago');  }
				const y = Math.floor(s / 31536000); return y + (y === 1 ? ' year ago' : ' years ago');
			}

			async function populateData() {
				const meta = await fetch(`${API}/submissions/${modId}/meta.json`).then(r => r.json());
				const user = await fetch(`${API}/users/${meta.submitter}`).then(r => r.json());
				document.title = "Funkin' Backstage | " + meta.title;
				document.getElementById('title-text').textContent = meta.title;
				document.getElementById('author-text').textContent = `• ${user.username}`;
				document.getElementById('mod-description').innerHTML = meta.description.replace(/\n/g, "<br>");
				setSlot('thumbnail-a', meta.thumbnails[0]);

				thumbnails = meta.thumbnails;
				for (const thumb of thumbnails)
					if (!isVideo(thumb)) { const i = new Image(); i.src = thumb; }
				updateVideoControls();

				for (const dlData of meta.dls) {
					console.log(dlData);
					document.getElementById("downloads-box").innerHTML += `<div style="display: flex; gap: 0.5vw; align-items: center;">
									<img class="download-button" style="width: 5vh; height: 5vh" src="https://funkinbackstage.com/mods/view/icon-download.png" onclick="trackDownload('${dlData.url}')"/>
									<a style="font-size: 6vh">v${dlData.version}</a>
								</div>`;
				}

				const token = localStorage.getItem('token');
				let isLiked = false;
				let me = null;
				if (token) {
					const meRes = await fetch(`${API}/me`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
						body: JSON.stringify({})
					});
					if (meRes.ok) {
						me = await meRes.json();
						isLiked = (me.likedSubmissions ?? []).includes(modId);
					}
				}

				const viewedKey = `viewed_${modId}`;
				if (!sessionStorage.getItem(viewedKey)) {
					const isOwner = me && me.id === meta.submitter;
					if (!isOwner) {
						fetch(`${API}/submissions/${modId}/view`, {
							method: 'POST',
							headers: token ? { 'Authorization': `Bearer ${token}` } : {}
						});
						sessionStorage.setItem(viewedKey, '1');
					}
				}
				const likeIcon = isLiked ? BASE + 'icon-like-filled.png' : BASE + 'icon-like-empty.png';
				document.getElementById('like-box').innerHTML = `<div style="display: flex; gap: 0.5vw; align-items: center;">
								<img draggable="false" id="like-icon" style="width: 5vh; height: 5vh" src="${likeIcon}"/>
								<a id="like-count" style="font-size: 6vh">${fmtNum(meta.likes ?? 0)}</a>
							</div>`;

				document.getElementById('category-text').textContent = "Category";
				document.getElementById('engine-text').textContent = `${meta.parent.replace('-', ' ')} - ${meta.child.replace('-', ' ')}`;
				
				if (meta.stars == 0) {
					if (meta.updateDate == "") {
						document.getElementById('featured-text').remove();
						document.getElementById('featured-icon').remove();
					} else {
						document.getElementById('featured-text').innerHTML = timeAgo(meta.updateDate);
						document.getElementById('featured-icon').src = "https://funkinbackstage.com/mods/assets/icon-updated.png";
					}
					document.getElementById('updated-icon').remove();
					document.getElementById('updated-text').remove();
					
					document.getElementById('added-text').innerHTML = timeAgo(meta.uploadDate);
				} else {
					if (meta.updateDate == "") {
						document.getElementById('updated-icon').remove();
						document.getElementById('updated-text').remove();
						document.getElementById('added-text').innerHTML = timeAgo(meta.uploadDate);
					} else {
						document.getElementById('added-text').innerHTML = relTime(meta.uploadDate);
						document.getElementById('updated-text').innerHTML = relTime(meta.updateDate);
					}
					document.getElementById('featured-text').innerHTML = 'FEATURED';
				}

				document.getElementById('download-text').textContent = meta.downloads.toLocaleString('en-US');
				document.getElementById('view-text').textContent = meta.views.toLocaleString('en-US');
			}
			populateData();

			function trackDownload(url) {
				fetch(`${API}/submissions/${modId}/download`, { method: 'POST' });
				window.open(url, '_blank');
			}

			async function toggleLike() {
				const token = localStorage.getItem('token');
				if (!token) { window.location.href = '/login'; return; }
				const res = await fetch(`${API}/submissions/${modId}/like`, {
					method: 'POST',
					headers: { 'Authorization': `Bearer ${token}` }
				});
				if (!res.ok) return;
				const data = await res.json();
				document.getElementById('like-icon').src = data.liked ? BASE + 'icon-like-filled.png' : BASE + 'icon-like-empty.png';
				document.getElementById('like-count').textContent = fmtNum(data.likes);
			}

			function getActiveVideo() {
				return document.querySelector('#thumbnail-' + activeSlot + ' video');
			}

			const BASE = 'https://funkinbackstage.com/mods/view/';

			function updateVideoControls() {
				const isVid = thumbnails.length > 0 && isVideo(thumbnails[curThumbnail]);
				const ctrl = document.getElementById('video-controls');
				ctrl.style.display = isVid ? 'flex' : 'none';
				if (isVid) {
					document.getElementById('btn-play').src = BASE + 'icon-playing.png';
					document.getElementById('btn-mute').src = BASE + 'icon-muted.png';
				}
			}

			function toggleVideoPlay() {
				const v = getActiveVideo();
				if (!v) return;
				if (v.paused) { v.play(); document.getElementById('btn-play').src = BASE + 'icon-playing.png'; }
				else { v.pause(); document.getElementById('btn-play').src = BASE + 'icon-paused.png'; }
			}

			function toggleVideoMute() {
				const v = getActiveVideo();
				if (!v) return;
				v.muted = !v.muted;
				document.getElementById('btn-mute').src = BASE + (v.muted ? 'icon-muted.png' : 'icon-ummuted.png');
			}

			function scrollThumbnail(amt) {
				curThumbnail += amt;
				if (curThumbnail < 0) curThumbnail = thumbnails.length - 1;
				else if (curThumbnail > thumbnails.length - 1) curThumbnail = 0;

				const incoming = activeSlot === 'a' ? 'b' : 'a';
				const outgoing = activeSlot;

				const outgoingVideo = document.querySelector('#thumbnail-' + outgoing + ' video');
				if (outgoingVideo) { outgoingVideo.pause(); outgoingVideo.muted = true; }

				setSlot('thumbnail-' + incoming, thumbnails[curThumbnail]);
				document.getElementById('thumbnail-' + incoming).style.opacity = '1';
				document.getElementById('thumbnail-' + outgoing).style.opacity = '0';
				activeSlot = incoming;
				updateVideoControls();
			}
		</script>
	</body>
</html>
