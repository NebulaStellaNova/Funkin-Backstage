<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funkin' Backstage | Global Chat</title>

  <meta property="og:title" content="Funkin' Backstage - Global Chat" />
  <meta property="og:description" content="For Modders. By Modders." />
  <meta property="og:image" content="https://funkinbackstage.com/favicon.png" />
  <meta name="theme-color" content="#ad0054" />

  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css" type="text/css">
  <link rel="stylesheet" href="style.css" type="text/css">
  <style>
    #chat-scroll {
      scrollbar-width: none;
    }
    #chat-scroll::-webkit-scrollbar {
      display: none;
    }
    #scroll-track {
      width: 40px;
      height: 100%;
      flex-shrink: 0;
      position: relative;
      background-image: url('scroll-bar-bg.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      cursor: pointer;
    }
    #scroll-thumb {
      position: absolute;
      width: 80px;
      height: 80px;
      left: 50%;
      transform: translateX(-50%);
      background-image: url('scroll-bar-track.png');
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center;
      cursor: grab;
    }
    #scroll-thumb:active {
      cursor: grabbing;
    }

    .sticker-in-bubble {
        height: 8.5vh;
    }
    .sticker-in-bubble:hover {
        height: 8.5vh;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      html, body {
        overflow-x: hidden;
        overflow-y: auto;
      }
      body {
        align-items: stretch !important;
        justify-content: flex-start !important;
        padding: 2vh 4vw !important;
        gap: 1.5vh !important;
        min-height: 100vh;
      }
      body > div:first-child {
        gap: 1.5vw;
        flex-wrap: wrap;
      }
      body > div:first-child h1 {
        font-size: 6vh !important;
      }
      #active-count {
        font-size: 2vh !important;
        margin-bottom: 0 !important;
      }
      #chat-box {
        width: 100% !important;
        height: 55vh !important;
      }
      #scroll-track {
        display: none !important;
      }
      #chat-scroll {
        scrollbar-width: thin !important;
      }
      #chat-scroll::-webkit-scrollbar {
        display: block !important;
        width: 4px;
      }
      #chat-scroll::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
      }
      body > .ui-box:last-of-type {
        width: 100% !important;
      }
      #sticker-bubble {
        right: 0 !important;
        width: 28vh !important;
        height: 28vh !important;
      }
      #chat-scroll h1 {
        font-size: 2.8vh !important;
      }
      #chat-scroll h1:last-child {
        font-size: 3.2vh !important;
      }
      .sticker-in-bubble {
        height: 5vh !important;
      }
      .footer-left, .footer-right {
        font-size: 0.75rem !important;
      }
    }
  </style>
</head>
<body style="display: flex; flex-direction: column; gap: 3vh; justify-content: center; background-image: url('bg.png'); background-size: cover; background-position: center; background-attachment: fixed;">
    <div style="display: flex; align-items: center; gap: 2vh;">
        <h1 style="font-family: 'FunkinLingLong', sans-serif; font-size: 10vh;">Global Chat</h1>
        <span id="active-count" style="font-family: 'FunkinOptions', sans-serif; font-size: 2.5vh; align-self: center; margin-bottom: 0.5rem; color: #BABABA">• 0 active</span>
    </div>
    <div class="ui-box" id="chat-box" style="width: 100rem; height: 65vh; padding-top: 0.9rem; padding-bottom: 0.8rem; display: flex; flex-direction: row; align-items: flex-start; gap: 0;">
        <div id="chat-scroll" style="flex: 1; height: 100%; overflow-y: scroll; display: flex; flex-direction: column; gap: 2vh; padding: 1vh;">
        </div>
        <div id="scroll-track">
            <div id="scroll-thumb"></div>
        </div>
    </div>
    <div class="ui-box" style="width: 100rem; height: 1rem; gap: 3vh; position: relative;">
        <input type="text" id="chat-bar" placeholder="Type something to send..." style="background: transparent; border: none; outline: none; font-family: 'FunkinOptions', sans-serif; font-size: 4vh; color: #E1E1E1; width: 100%; caret-color: #E1E1E1; margin-top: 1vh;" onkeydown="if(event.key==='Enter')sendMessage()"/>
        <div style="position: relative; flex-shrink: 0;">
            <div id="sticker-bubble" style="display: none; position: absolute; bottom: 0; right: 7vw; background-image: url('sticker-bubble.png'); background-size: contain; background-repeat: no-repeat; width: 40vh; height: 40vh; padding: 2vh; gap: 1vh;">
                <img id="bfSticker1" class="sticker-in-bubble smooth-btn" src="https://api.funkinbackstage.com/stickers/bfSticker1.png" onclick="addSticker(this.id)"/>
                <img id="picoSticker1" class="sticker-in-bubble smooth-btn" src="https://api.funkinbackstage.com/stickers/picoSticker1.png" onclick="addSticker(this.id)"/>
                <img id="vampSticker1" class="sticker-in-bubble smooth-btn" src="https://api.funkinbackstage.com/stickers/vampSticker1.png" onclick="addSticker(this.id)"/>
            </div>
            <img src="icon-sticker.png" class="smooth-btn" style="width: 3.5vh; height: 4vh; margin-left: auto; cursor: pointer;" onclick="toggleStickerBubble()"/>
        </div>
        <img src="icon-send.png" class="smooth-btn" style="width: 4vh; height: 4vh; margin-left: auto; flex-shrink: 0; cursor: pointer;" onclick="sendMessage()"/>
    </div>
</body>

<p class="footer-left" style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; z-index: 101;"></p>
<p class="footer-right" style="position: fixed; bottom: 1rem; right: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.25rem; color: #666; z-index: 101; text-align: right;"></p>

<script src="../api.js"></script>
<script>
    const avatarCache = new Map();
    async function getAvatarSrc(userId) {
        if (!avatarCache.has(userId)) {
            try {
                const res = await fetch(`${API}/avatars/${userId}.png`, { method: 'HEAD' });
                avatarCache.set(userId, res.ok);
            } catch {
                avatarCache.set(userId, false);
            }
        }
        return avatarCache.get(userId) ? `${API}/avatars/${userId}.png` : '../icon-profile-out.png';
    }

    async function getStickers() {
        const files = await fetch(`${API}/stickers`).then(r => r.json());
        return files.map(f => `${f}`.replace('.png', ''));
    }

    const scrollEl = document.getElementById('chat-scroll');
    const track = document.getElementById('scroll-track');
    const thumb = document.getElementById('scroll-thumb');

    const THUMB_H = 85;
    function updateThumb() {
        const trackH = track.clientHeight;
        const scrollRange = scrollEl.scrollHeight - scrollEl.clientHeight;
        const thumbTop = scrollRange > 0 ? (scrollEl.scrollTop / scrollRange) * (trackH - THUMB_H) : 0;
        thumb.style.top = thumbTop + 'px';
    }

    scrollEl.addEventListener('scroll', updateThumb);

    let dragging = false, startY = 0, startScrollTop = 0;
    thumb.addEventListener('mousedown', e => {
        dragging = true;
        startY = e.clientY;
        startScrollTop = scrollEl.scrollTop;
        e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
        if (!dragging) return;
        const dy = e.clientY - startY;
        const trackH = track.clientHeight;
        const scrollRange = scrollEl.scrollHeight - scrollEl.clientHeight;
        scrollEl.scrollTop = startScrollTop + (dy / (trackH - THUMB_H)) * scrollRange;
    });
    document.addEventListener('mouseup', () => { dragging = false; });

    track.addEventListener('click', e => {
        if (e.target === thumb) return;
        const rect = track.getBoundingClientRect();
        const ratio = (e.clientY - rect.top) / track.clientHeight;
        scrollEl.scrollTop = ratio * scrollEl.scrollHeight;
    });

    let updating = false;
    let scrollAfterUpdate = false;
    async function updateTheMessages() {
        if (updating) return;
        updating = true;
        const doScroll = scrollAfterUpdate;
        scrollAfterUpdate = false;
        try {
            const stickerList = await getStickers();
            let out = "";
            const all = await fetch(`${API}/chat/read`).then(r => r.json());
            const messages = all.slice(-25);
            for (const message of messages) {
                const user = await fetch(`${API}/users/${message.poster}`).then(r => r.json());
                const avatarSrc = await getAvatarSrc(user.id);
                let content = escapeHTML(`${message.contents}`.trim());
                const stickerOnly = content.startsWith(':') && content.endsWith(':');
                for (const sticker of stickerList) {
                    content = content.replace(`:${sticker}:`, `<img src="${API}/stickers/${sticker}.png" style="height: ${stickerOnly ? '13' : '5' }vh; ${stickerOnly ? '' : 'margin: 1vh; margin-top: -1vh;'}"/>`);
                }
                out += `
                <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 0rem; justify-content: start;">
                    <div style="display: flex; justify-content: flex-start; align-items: center; gap: 0.5vw">
                        <div style="position: relative; height: 4vh; width: 4vh; flex-shrink: 0;">
                            <img src="${avatarSrc}" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); height: ${avatarCache.get(user.id) ? '3.5' : '4'}vh; width: ${avatarCache.get(user.id) ? '3.5' : '4'}vh; border-radius: 50%; object-fit: cover;"/>
                            ${avatarCache.get(user.id) ? `<img src="../icon-profile-in.png" style="position: absolute; top: 0; left: 0; height: 4vh; width: 4vh;"/>` : ''}
                        </div>
                        <h1 style="font-family: 'FunkinOptions', sans-serif; font-size: 3vh; margin-top: 1.5vh; color: #BABABA">${user.username}</h1>
                    </div>
                    <h1 style="font-family: 'FunkinOptions', sans-serif; font-size: 4vh; margin: 0; display: flex; align-items: center">${content}</h1>
                </div>
                `
            }
            const box = document.getElementById('chat-scroll');
            box.innerHTML = out;
            if (doScroll) {
                const imgs = Array.from(box.querySelectorAll('img'));
                const pending = imgs.filter(img => !img.complete);
                if (pending.length === 0) {
                    box.scrollTop = box.scrollHeight;
                    updateThumb();
                } else {
                    let done = 0;
                    const onSettle = () => { if (++done >= pending.length) { box.scrollTop = box.scrollHeight; updateThumb(); } };
                    pending.forEach(img => { img.addEventListener('load', onSettle); img.addEventListener('error', onSettle); });
                }
            } else {
                updateThumb();
            }
        } finally {
            updating = false;
        }
    }
    if (!sessionStorage.getItem('chatSessionId'))
        sessionStorage.setItem('chatSessionId', Math.random().toString(36).slice(2));
    const chatSessionId = sessionStorage.getItem('chatSessionId');

    function pingServer() {
        fetch(`${API}/chat/ping`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: chatSessionId }) });
    }
    pingServer();
    setInterval(pingServer, 5000);

    const countStream = new EventSource(`${API}/chat/count-stream`);
    countStream.onmessage = e => {
        document.getElementById('active-count').innerHTML = `<a style="color: #00FF00;">•</a> ${e.data} active`;
    };

    updateTheMessages();
    const messageStream = new EventSource(`${API}/chat/message-stream`);
    messageStream.onmessage = () => updateTheMessages();
    // fallback re-sync every 30s in case SSE misses anything
    setInterval(updateTheMessages, 30000);

    function addSticker(id) {
        document.getElementById('chat-bar').value += `:${id}: `;
        toggleStickerBubble();
        document.getElementById('chat-bar').focus();
    }

    function toggleStickerBubble() {
        const bubble = document.getElementById('sticker-bubble');
        bubble.style.display = bubble.style.display === 'none' ? 'flex' : 'none';
    }

    function escapeHTML(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function normalize(str) {
        return str.toLowerCase()
            .replace(/0/g, 'o').replace(/1/g, 'i').replace(/3/g, 'e')
            .replace(/4/g, 'a').replace(/5/g, 's').replace(/8/g, 'b')
            .replace(/@/g, 'a').replace(/\$/g, 's').replace(/[^a-z]/g, '');
    }

    async function isBlacklisted(text) {
        const raw = await fetch(`${API}/word-blacklist`).then(r => r.text());
        const words = raw.split('\n').map(w => normalize(w.trim())).filter(Boolean);
        const normText = normalize(text);
        // Check to see if it's an embed, so fucking weirdos can't send wild shit, because
        // we don't want that now, do we?
        const htmlRegex = /<\/?[a-z][\s\S]*>/i;
        if (htmlRegex.test(text)) {
            document.getElementById('chat-bar').value = "";
            return true;
        }
        return words.some(w => normText.includes(w));
    }

    async function sendMessage() {
        const contents = document.getElementById('chat-bar').value.trim();
        if (!contents) return;
        if (await isBlacklisted(contents)) {
            document.getElementById('chat-bar').value = "";
            return;
        }
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '../login'; return; }
        const { id } = await fetch(`${API}/me`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({})
        }).then(r => r.json());

        await fetch(`${API}/chat/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user: id, contents })
        });
        document.getElementById('chat-bar').value = "";
        scrollAfterUpdate = true;
        await updateTheMessages();
    }
</script>

</html>
