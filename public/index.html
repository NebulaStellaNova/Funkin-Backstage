<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funkin' Backstage</title>
  <style>
    @font-face {
      font-family: 'FunkinOptions';
      src: url('fonts/FunkinOptions.otf') format('opentype');
    }
    @font-face {
      font-family: 'FunkinLingLong';
      src: url('fonts/FunkinLingLong.otf') format('opentype');
    }
    @font-face {
      font-family: '5by7';
      src: url('fonts/5by7.ttf') format('truetype');
    }
    @font-face {
      font-family: 'DS-Digital';
      src: url('fonts/DS-Digital.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Inconsolata ExtraBold';
      src: url('fonts/Inconsolata ExtraBold.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: url('bg.png') no-repeat center center / cover fixed;
      color: #f0f0f0;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 3.3rem;
      color: #888;
    }

    .smooth-btn {
      transform: scale(1); 
      transition: transform 0.3s ease-out; 
    }

    .smooth-btn:hover {
      transform: scale(1.05);
    }

  </style>
</head>
<body>
  <div class="container">
    <h1 style="font-family: 'FunkinLingLong', sans-serif;">Funkin' Backstage</h1>
    <p style="font-family: 'FunkinOptions', sans-serif;">For Modders. By Modders. <i><u>NO</u></i> Automation.</p>
    <div style="display: block; margin: 1rem auto 0;">
      <img src="discover mods.png" class="smooth-btn" alt="Discover Mods" style="height: 4rem; margin-right: 10px;">
      <img src="sign-up.png" class="smooth-btn" alt="Discover Mods" style="height: 4rem; margin-left: 10px;">
    </div>
  </div>
  <p style="position: fixed; bottom: 1rem; left: 1rem; font-family: 'Inconsolata ExtraBold', sans-serif; font-size: 1.5rem; color: #666;">© 2026 NebulaStellaNova — Fan-made, not affiliated with Newgrounds or The Funkin' Crew</p>
</body>
</html>
